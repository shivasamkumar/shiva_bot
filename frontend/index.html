<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shiva Bot</title>
  <link rel="stylesheet" href="/static/style.css">

  <!-- marked.js for Markdown → HTML -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    marked.setOptions({
      breaks: true,
      gfm: true,
      headerIds: false,
      mangle: false,
      sanitize: false,
      smartLists: true,
      smartypants: true,
      xhtml: false,
      pedantic: false,
      silent: true
    });
  </script>
</head>
<body>
  <!-- New Chat button -->
  <div id="controls">
    <button id="new-chat-btn">New Chat</button>
  </div>

  <div id="chat-log"></div>

  <div id="chat-input-area">
    <input id="chat-input" placeholder="Ask Shiva…" autocomplete="off" />
    <button id="send-btn">Send</button>
  </div>

  <script src="/static/script.js"></script>
</body>
</html>
